<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>축구선수 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+KR:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 웹에서만: 데스크탑 앱 받기 -->
<div id="appband">
  <div class="txt">
    <b>🖥️ 데스크탑 앱으로 받으면 바탕화면 맨 아래에서 선수가 계속 뛰어요</b>
    <span>처음 열 때 경고가 뜨면 <a href="#" data-act="howto">설치 방법</a>을 봐 주세요</span>
  </div>
  <div class="dls">
    <a class="dl hl" href="https://github.com/Joo-j/soccer_star/releases/latest/download/SoccerStar-mac-arm64.dmg" target="_blank" rel="noopener">🍎 Mac (Apple 칩)</a>
    <a class="dl hl" href="https://github.com/Joo-j/soccer_star/releases/latest/download/SoccerStar-mac-x64.dmg" target="_blank" rel="noopener">🍎 Mac (Intel)</a>
    <a class="dl" href="https://github.com/Joo-j/soccer_star/releases/latest/download/SoccerStar-win-x64.exe" target="_blank" rel="noopener">🪟 Windows</a>
    <button class="dl" data-act="howto">❓ 설치 방법</button>
  </div>
</div>

<!-- 캠프 창 -->
<div id="camp" class="panel hidden">
  <nav id="nav"></nav>
  <section class="main">
    <div class="camp-head">
      <div class="who" id="camp-who"></div>
      <div class="chips-res" id="camp-res"></div>
      <button class="x" data-act="closeCamp" title="닫기">✕</button>
    </div>
    <div class="camp-body" id="camp-body"></div>
    <div class="camp-foot" id="camp-foot"></div>
  </section>
</div>

<!-- 하단 띠 -->
<div id="bar">
  <canvas id="cv"></canvas>
  <div id="hud" data-act="openCamp"></div>
  <div id="toasts"></div>
</div>

<!-- 시작 화면 · 알림 창 -->
<div id="overlay" class="hidden"><div class="panel modal" id="modal"></div></div>
<div id="banner" class="hidden"></div>

<script src="src/data.js"></script>
<script src="src/core.js"></script>
<script src="src/match.js"></script>
<script src="src/career.js"></script>
<script src="src/net.js"></script>
<script src="src/bar.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
